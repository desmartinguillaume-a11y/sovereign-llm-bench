# Pricing configuration for sovereign-llm-bench
# Focus: 4 cloud souverains français pour usage LLM grands comptes
#
# PRICE HISTORY
# v1 — 2025-08 : valeurs initiales (training data cutoff)
# v2 — 2026-05-08 : mise à jour via web search, intégration llmfit pour TPS OVH
#
# IMPORTANT — S3NS et Bleu n'ont PAS de tarifs publics pour leurs LLM.
# Les prix ci-dessous sont des PROXIES issus des plateformes sous-jacentes
# (Vertex AI pour S3NS, Azure OpenAI pour Bleu). Un surcoût souverain s'applique
# en pratique — contacter S3NS/Bleu pour les tarifs réels.

metadata:
  retrieved_date: "2026-05-08"
  usd_to_eur: 0.92
  llmfit_version: "github.com/AlexsJones/llmfit"
  llmfit_formula: "tps = (bandwidth_gbps / model_size_gb) * efficiency_factor(0.55)"
  note: >
    Prices are public list prices with no volume discounts.
    API providers billing in USD converted at usd_to_eur rate.
    OVH throughput estimated via llmfit bandwidth formula.

providers:

  s3ns:
    name: "S3NS (Thales × Google Cloud)"
    billing: "pay-per-token"
    sovereign: true
    certification: "SecNumCloud 3.2 — ANSSI (décembre 2025)"
    data_residency: "France (Google Cloud Paris / Europe)"
    underlying_platform: "Google Cloud Vertex AI"
    pricing_status: "PROXY — tarifs Vertex AI, pas de tarif S3NS public"
    source_url: "https://cloud.google.com/vertex-ai/generative-ai/pricing"
    # Gemini 2.5 lineup (mai 2026)
    models:
      gemini-2.5-pro:
        display_name: "Gemini 2.5 Pro"
        currency: "USD"
        input_per_1m_tokens: 1.25
        output_per_1m_tokens: 10.00
        context_window: 1000000
        notes: "Scénarios qualité (S1, S2). Prix contexte <200K. Au-delà : $2.50 input."
      gemini-2.5-flash:
        display_name: "Gemini 2.5 Flash"
        currency: "USD"
        input_per_1m_tokens: 0.30
        output_per_1m_tokens: 2.50
        context_window: 1000000
        notes: "Scénarios intermédiaires."
      gemini-2.5-flash-lite:
        display_name: "Gemini 2.5 Flash-Lite"
        currency: "USD"
        input_per_1m_tokens: 0.10
        output_per_1m_tokens: 0.40
        context_window: 1000000
        notes: "Scénarios volume (S3, S4)."

  bleu:
    name: "Bleu (Microsoft × Orange / Capgemini)"
    billing: "pay-per-token"
    sovereign: true
    certification: "qualification SecNumCloud en cours (2026)"
    data_residency: "France"
    underlying_platform: "Microsoft Azure OpenAI"
    pricing_status: "PROXY — tarifs Azure OpenAI, pas de tarif Bleu public"
    source_url: "https://azure.microsoft.com/en-us/pricing/details/ai-foundry-models/aoai/"
    # Azure OpenAI lineup (mai 2026). GPT-4o doublé vs août 2025.
    models:
      gpt-4.1:
        display_name: "GPT-4.1"
        currency: "USD"
        input_per_1m_tokens: 2.00
        output_per_1m_tokens: 8.00
        context_window: 1000000
        notes: "Scénarios qualité (S1, S2)."
      gpt-4o-mini:
        display_name: "GPT-4o mini"
        currency: "USD"
        input_per_1m_tokens: 0.15
        output_per_1m_tokens: 0.60
        context_window: 128000
        notes: "Scénarios volume (S3, S4). Prix inchangé depuis août 2025."

  scaleway:
    name: "Scaleway Generative APIs"
    billing: "pay-per-token"
    sovereign: true
    certification: "HDS, ISO 27001, SecNumCloud (en cours)"
    data_residency: "France (Paris)"
    pricing_status: "OFFICIEL — tarifs publics sur scaleway.com"
    source_url: "https://www.scaleway.com/en/pricing/model-as-a-service/"
    verify_manually: true
    # Tarif plat tous modèles sur Generative APIs (mars 2026, confirmé multiples sources).
    # Même prix pour Llama 3.1 70B et Mistral Large 3 — serverless partagé.
    # Source comparatif: juicefactory.ai/en/guides/eu-llm-api-comparison (mars 2026)
    # NOTE: la page officielle retourne 403 aux bots — vérifier manuellement sur scaleway.com
    models:
      llama-3.1-70b-instruct:
        display_name: "Llama 3.1 70B Instruct"
        currency: "EUR"
        input_per_1m_tokens: 0.15
        output_per_1m_tokens: 0.35
        context_window: 131072
        notes: "Scénarios volume (S3, S4). Tarif plat Scaleway Generative APIs."
      mistral-large-3:
        display_name: "Mistral Large 3 (2512)"
        currency: "EUR"
        input_per_1m_tokens: 0.15
        output_per_1m_tokens: 0.35
        context_window: 256000
        notes: >
          Scénarios qualité (S1, S2). Même tarif plat que les autres modèles sur
          Generative APIs. Mistral Large 3 sur Scaleway = même prix que Llama 3.1 70B.
          Vérifier disponibilité du modèle sur la plateforme.

  ovh_selfhosted:
    name: "OVH Self-hosted (GPU cloud souverain FR)"
    billing: "gpu-per-hour"
    sovereign: true
    certification: "HDS, ISO 27001, SecNumCloud (OVHcloud)"
    data_residency: "France (Gravelines, Strasbourg, Roubaix)"
    pricing_status: "OFFICIEL — prix publics OVH, confirmés multiples comparateurs"
    source_url: "https://www.ovhcloud.com/en/public-cloud/prices/"
    # Throughput calculé via formule llmfit :
    # tps = (bandwidth_gbps / model_size_gb) * efficiency(0.55)
    # Voir: github.com/AlexsJones/llmfit — src/hardware.rs (bandwidth) + src/fit.rs (formula)
    hardware:
      a100-sxm:
        display_name: "NVIDIA A100 SXM 80GB"
        bandwidth_gbps: 2039.0   # source: llmfit hardware.rs — "A100 SXM" entry
        vram_gb: 80
        # OVH "A100-180" (1× A100 SXM 80GB, 180GB RAM système) : €2.75/h
        # Source officielle : annonce OVH sept 2023 + OVHcloud newsroom
        # A100 PCIe 40GB disponible à €1.52/h (Paris) — inadéquat pour Llama3-70B Q4 (39GB)
        price_per_hour_eur: 2.75
        verify_manually: true
      a100-pcie:
        display_name: "NVIDIA A100 PCIe 40GB"
        bandwidth_gbps: 1555.0   # source: llmfit hardware.rs — "A100" entry
        vram_gb: 40
        price_per_hour_eur: 1.52  # EU data centers (Paris), comparateurs mars 2026
        verify_manually: true
        notes: "Déconseillé pour Llama3-70B Q4 (39GB) : seulement 1GB VRAM disponible pour KV cache."
      l40s:
        display_name: "NVIDIA L40S 48GB"
        bandwidth_gbps: 864.0    # source: llmfit hardware.rs — "L40S" entry
        vram_gb: 48
        price_per_hour_eur: 1.72  # marché général L40S 2026, OVH prix non confirmé
        verify_manually: true
    models:
      llama3-70b-q4:
        display_name: "Llama 3 70B (4-bit GPTQ)"
        hardware: "a100-sxm"
        gpus_required: 1
        # Llama 3 70B en Q4 (4.5 bits/param effectif) ≈ 39 GB VRAM
        model_size_gb: 39.0
        # Paramètres pour calcul KV cache (utilisés pour estimer batch_size réel)
        n_layers: 80
        n_kv_heads: 8      # GQA Llama 3
        d_head: 128
        kv_dtype_bytes: 2  # fp16
        llmfit_efficiency: 0.55
        llmfit_batch_efficiency: 0.70
        notes: >
          Déployé avec vLLM. TPS calculé via formule llmfit avec bandwidth A100 PCIe.
          Batch size limité par VRAM disponible après chargement du modèle.
