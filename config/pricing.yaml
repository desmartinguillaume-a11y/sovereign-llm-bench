# Pricing configuration for sovereign-llm-bench
# All API prices in USD per 1M tokens unless noted.
# OVH GPU prices in EUR/hour (OVH bills in EUR).
#
# PRICE HISTORY
# v1 — 2025-08 : initial values from model training data (cutoff août 2025)
# v2 — 2026-05-08 : updated via web search (see notes per provider)

metadata:
  retrieved_date: "2026-05-08"
  knowledge_cutoff_date: "2025-08"
  usd_to_eur: 0.92  # Update to current spot rate before publishing results
  note: >
    Prices are public list prices with no volume discounts applied.
    API providers bill in USD; OVH bills in EUR.
    Self-hosted cost/token is derived from GPU price and calibrated throughput.

providers:

  mistral:
    name: "Mistral API (EU)"
    billing: "pay-per-token"
    data_residency: "EU (Paris)"
    source_url: "https://mistral.ai/pricing"
    # v2 update: mistral-large-latest now aliases Mistral Large 3 (2512, Dec 2025)
    # Price dropped from $2.00/$6.00 to $0.50/$1.50 — ~75% reduction.
    # Sources: https://llm-stats.com/models/mistral-large-latest
    #          https://openrouter.ai/mistralai/mistral-large-2512
    models:
      mistral-large-latest:
        display_name: "Mistral Large 3 (2512)"
        alias_target: "mistral-large-2512"
        currency: "USD"
        input_per_1m_tokens: 0.50
        output_per_1m_tokens: 1.50
        context_window: 256000
        notes: "Used for quality scenarios (S1, S2). Was $2.00/$6.00 (Large 2) as of Aug 2025."
      mistral-small-latest:
        display_name: "Mistral Small 3"
        currency: "USD"
        input_per_1m_tokens: 0.10
        output_per_1m_tokens: 0.30
        context_window: 32768
        notes: "Used for volume scenarios (S3, S4). Price unchanged from Aug 2025."

  anthropic:
    name: "Anthropic Claude API"
    billing: "pay-per-token"
    data_residency: "EU available via AWS eu-west regions"
    source_url: "https://www.anthropic.com/pricing"
    # v2 update: model family moved to 4.x (Haiku 4.5, Sonnet 4.6).
    # Prices slightly higher on Haiku ($0.80→$1.00 input, $4.00→$5.00 output).
    # Sonnet price unchanged at $3.00/$15.00.
    # Sources: https://platform.claude.ai/docs/en/about-claude/pricing
    #          https://www.aipricing.guru/anthropic-pricing/
    models:
      claude-haiku-4-5:
        display_name: "Claude Haiku 4.5"
        currency: "USD"
        input_per_1m_tokens: 1.00
        output_per_1m_tokens: 5.00
        context_window: 200000
        notes: "Used for volume scenarios (S3, S4). Was Haiku 3.5 at $0.80/$4.00."
      claude-sonnet-4-6:
        display_name: "Claude Sonnet 4.6"
        currency: "USD"
        input_per_1m_tokens: 3.00
        output_per_1m_tokens: 15.00
        context_window: 200000
        notes: "Used for quality scenarios (S1, S2). Price unchanged from Sonnet 3.7."

  azure_openai:
    name: "Azure OpenAI (EU)"
    billing: "pay-per-token"
    data_residency: "EU (West Europe / Sweden Central)"
    source_url: "https://azure.microsoft.com/en-us/pricing/details/azure-openai/"
    # v2 update: GPT-4o price DOUBLED ($2.50→$5.00 input, $10→$15 output).
    # GPT-4o mini unchanged.
    # Source: https://azure.microsoft.com/en-us/pricing/details/azure-openai/
    #         Search result confirms $5.00/$15.00 for global deployment, May 2026.
    models:
      gpt-4o-mini:
        display_name: "GPT-4o mini"
        currency: "USD"
        input_per_1m_tokens: 0.15
        output_per_1m_tokens: 0.60
        context_window: 128000
        notes: "Used for volume scenarios (S3, S4). Price unchanged from Aug 2025."
      gpt-4o:
        display_name: "GPT-4o"
        currency: "USD"
        input_per_1m_tokens: 5.00
        output_per_1m_tokens: 15.00
        context_window: 128000
        notes: "Used for quality scenarios (S1, S2). Was $2.50/$10.00 as of Aug 2025."

  ovh_selfhosted:
    name: "OVH Self-hosted"
    billing: "gpu-per-hour"
    data_residency: "EU (Gravelines / Strasbourg / Roubaix)"
    source_url: "https://www.ovhcloud.com/en/public-cloud/prices/"
    # v2 update: OVH instance naming is "A100-180/360/720" (suffix = system RAM in GB).
    # A100-180 = 1× NVIDIA A100 80GB VRAM, 180GB system RAM.
    # Official launch price (Sep 2023, still listed): €2.75/hour.
    # Comparison sites (Mar 2026) report €1.52-€1.85/hour for EU A100 instances.
    # UNCERTAINTY: OVH pricing page returns 403. Using €2.75/hr (official announced
    # price) as conservative estimate. Mark for manual verification.
    # Sources: https://corporate.ovhcloud.com/en/newsroom/news/adds-cutting-edge-gpus/
    #          https://www.spheron.network/blog/gpu-cloud-pricing-comparison-2026/
    hardware:
      a100-80gb:
        display_name: "NVIDIA A100 80GB (OVH A100-180)"
        instance_name: "A100-180"
        price_per_hour_eur: 2.75
        price_per_hour_eur_range_low: 1.52  # comparison sites Mar 2026
        price_per_hour_eur_range_high: 2.75  # official announced price
        vram_gb: 80
        verify_manually: true
    models:
      llama3-70b-q4:
        display_name: "Llama 3 70B (4-bit GPTQ)"
        hardware: "a100-80gb"
        gpus_required: 1
        # Throughput calibrated from vLLM benchmarks on A100 80GB:
        # 4-bit Llama3-70B with vLLM, batch_size=32: ~900 tok/s output
        # Source: vLLM throughput benchmarks, LLMfit community (2024-2025)
        tokens_per_second: 900
        # Overhead: OS, vLLM server, monitoring ~15%
        effective_tokens_per_second: 765
        notes: "Served with vLLM. Throughput is aggregate output tok/s under sustained load."
